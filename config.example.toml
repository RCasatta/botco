# Copy to config.toml. Relative paths are relative to this file.

state_dir = "state"
timezone = "Europe/Rome"
# reference_file = "reference.md"   # example posts to learn tone from
# The bot that posts operational messages and records; no model.
publisher = "publisher"

# Model servers, named so accounts can pick one.
[models.local]
url = "http://100.110.202.124:8080/v1"   # TabbyAPI, 27B
id = "Qwen3.8-27B-exl3-SC-4bpw"          # pi needs it for sessions
timeout = 1800
slots = 2           # requests at once: turns may use both...
session_slots = 1   # ...sessions only one, so chat never waits behind them

# Accounts: people or models. The code never checks which; roles decide what
# an account may do, and the engine how a model works.

[accounts.riccardo]          # no engine: a person
roles = ["owner"]
zulip = "Riccardo"                   # Zulip full name, email or user id
github = "RCasatta"

[accounts.strategist]
roles = ["strategist", "writer"]
zuliprc = "strategist-zuliprc"
engine = { kind = "turn", persona = "strategist", model = "local", max_tokens = 16000 }

[accounts.writer]
roles = ["writer"]
zuliprc = "writer-zuliprc"
# Every turn account uses the same thinking setting: the chat template starts
# the prompt with it, so a different one would cost the shared cache prefix.
engine = { kind = "turn", persona = "writer", model = "local", temperature = 0.9 }

[accounts.editor]
roles = ["editor"]
zuliprc = "editor-zuliprc"
engine = { kind = "turn", persona = "editor", model = "local", temperature = 0.6 }

# [accounts.dev]
