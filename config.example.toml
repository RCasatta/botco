# No model: publishes approved posts and records metrics.
[accounts.publisher]
roles = []
zuliprc = "publisher-zuliprc"

# Roles. `includes` grants another role's permissions too; `unaddressed`
# routes a message from this role that mentions nobody; `priority` orders the
# turns this role's requests wake (lower first); `turns_per_day` is the budget
# of accounts with this role.
[roles.owner]
includes = ["editor", "strategist", "writer"]
unaddressed = "strategist"
priority = 0

[roles.strategist]
turns_per_day = 150

[roles.writer]
turns_per_day = 100

[roles.editor]
turns_per_day = 100

[roles.dev]
turns_per_day = 10

# Kinds: a label plus its policy. create/edit/close list the roles that may
# (absent: anyone; author and assignee may always edit and close their task);
# approve lists the roles that must each approve the current body.
[kinds.post]
stream = "drafts"
create = ["writer", "strategist"]
edit = ["writer", "strategist"]
validate = "x_post"            # 280 chars, no links...
approve = ["editor", "owner"]  # one from each role
max_revisions = 3              # then waits on the owner
sink = "x"

# A reply to a post on X: the API may only reply to posts that mention us,
# so once approved the owner posts it by hand and closes it with /done.
[kinds.reply]
stream = "replies"
create = ["writer", "strategist"]
edit = ["writer", "strategist"]
validate = "x_post"
approve = ["editor"]
posted_by = "owner"
close = ["owner"]
max_revisions = 3

[kinds.plan]
stream = "plan"
create = ["strategist"]
edit = ["strategist"]
one_open = true                # a new plan closes the old one

[kinds.task]                   # the default kind: waits on the assignee
stream = "tasks"               # until they close it
create = ["strategist", "owner"]

[schedules.weekly-plan]
cron = "0 8 * * MON"
kind = "plan"
assignee = "strategist"
title = "Plan for week {iso_week}"
body = "Review last week's posts and set three goals."

[dispatcher]
heartbeat_minutes = 60
active_from = "07:30"
active_to = "23:00"
max_steps = 10
turns_per_day = 300            # for accounts no role gives a budget
activity_log = true
continue_minutes = 15
continue_max_chars = 200000
max_depth = 1                  # agents' tasks cannot create more tasks
max_new_tasks_per_day = 10     # per account
max_open_per_assignee = 20

[sinks.x]
account = "publisher"
times = ["10:00", "14:00", "19:00"]
min_gap_minutes = 60
max_chars = 280
metrics_time = "23:30"
metrics_days = 7               # posts whose numbers are read daily (paid reads)
dry_run = true
env_file = "x.env"

[streams]
published = "published"
metrics = "metrics"
ops = "ops"

[breakers]
bot_messages_per_hour = 40
bot_streak_per_topic = 20

# Read-only sources.
[sources]
poll_minutes = 15              # referenced external issues

# The lab notebook: markdown reports of the inference experiments. On ripper
# the service sees it at /run/botco-lab.
[sources.lab]
dir = "/run/botco-lab"
exclude = ["CLAUDE.md", "models", "llama.cpp", "Strata", "src", ".git"]
notify = "strategist"

