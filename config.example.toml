# Copy to config.toml. Relative paths are relative to this file.

state_dir = "state"
timezone = "Europe/Rome"
# reference_file = "reference.md"   # example posts to learn tone from

[llm]
base_url = "http://100.110.202.124:8080/v1"
timeout = 1800
concurrency = 1

[streams]
plan = "plan"
drafts = "drafts"
published = "published"
metrics = "metrics"
ops = "ops"

[agents]
coordinator = "strategist"
heartbeat_minutes = 60
active_from = "07:30"
active_to = "23:00"
max_steps = 10
max_turns_per_day = 300
activity_log = true

[publishing]
times = ["10:00", "14:00", "19:00"]
min_gap_minutes = 60
ceo_approval = true
max_chars = 280
metrics_time = "23:30"

[breakers]
bot_messages_per_hour = 40
bot_streak_per_topic = 20

# The lab notebook: markdown reports of the inference experiments, read by
# the agents through tools. On ripper the service sees it at /run/botco-lab.
[lab]
dir = "/run/botco-lab"
exclude = ["CLAUDE.md", "models", "llama.cpp", "Strata", "src", ".git"]

[x]
dry_run = true
env_file = "x.env"

[personas.strategist]
zuliprc = "strategist-zuliprc"
thinking = true
max_tokens = 16000

[personas.writer]
zuliprc = "writer-zuliprc"
thinking = false
max_tokens = 4096
temperature = 0.9

[personas.editor]
zuliprc = "editor-zuliprc"
thinking = true
max_tokens = 8000
temperature = 0.6

# No LLM: publishes approved drafts and records metrics.
[personas.publisher]
zuliprc = "publisher-zuliprc"
